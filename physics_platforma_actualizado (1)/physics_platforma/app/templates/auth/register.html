{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto my-8 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">Crear Cuenta</h1>
        <p class="text-sm text-slate-500 mt-1">Registrate para comenzar con tu programa academico</p>
    </div>

    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded">
        {{ error }}
    </div>
    {% endif %}

    <form action="/auth/register" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Nombre Completo</label>
            <input type="text" name="full_name" required placeholder="Ej: Santiago Pini"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-physics-500 focus:bg-white transition">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Usuario</label>
            <input type="text" name="username" required placeholder="Ej: Spini"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-physics-500 focus:bg-white transition">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Contrasena</label>
            <input type="password" name="password" required minlength="6" placeholder="Minimo 6 caracteres"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-physics-500 focus:bg-white transition">
            <span class="text-xs text-slate-400 mt-1 block">Sera encriptada con Argon2id de forma segura.</span>
        </div>

        <!-- Selector fundamental: 5.º o 6.º de Liceo -->
        <div class="pt-2">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                ¿En que ano estas?
            </label>
            <div class="grid grid-cols-2 gap-3">
                <label class="cursor-pointer">
                    <input type="radio" name="current_year" value="5" class="peer sr-only" checked>
                    <div class="p-3.5 text-center border-2 border-slate-200 rounded-xl peer-checked:border-physics-600 peer-checked:bg-physics-50 peer-checked:text-physics-800 transition">
                        <span class="block text-lg font-black">5.º Ano</span>
                        <span class="block text-xs text-slate-500 mt-0.5">Mecanica, Fluidos y Ondas</span>
                    </div>
                </label>

                <label class="cursor-pointer">
                    <input type="radio" name="current_year" value="6" class="peer sr-only">
                    <div class="p-3.5 text-center border-2 border-slate-200 rounded-xl peer-checked:border-physics-600 peer-checked:bg-physics-50 peer-checked:text-physics-800 transition">
                        <span class="block text-lg font-black">6.º Ano</span>
                        <span class="block text-xs text-slate-500 mt-0.5">Electromagnetismo y Circuitos</span>
                    </div>
                </label>
            </div>
        </div>

        <button type="submit"
            class="w-full mt-4 py-2.5 px-4 bg-physics-600 hover:bg-physics-700 text-white font-bold rounded-lg shadow transition text-sm">
            Registrarme y Comenzar
        </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center text-sm text-slate-600">
        ¿Ya tienes una cuenta?
        <a href="/auth/login" class="font-bold text-physics-600 hover:underline">Inicia sesion</a>
    </div>
</div>
{% endblock %}
