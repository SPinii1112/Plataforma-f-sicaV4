{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">Iniciar Sesion</h1>
        <p class="text-sm text-slate-500 mt-1">Accede a tu cuenta y continua tu aprendizaje de Fisica</p>
    </div>

    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded">
        {{ error }}
    </div>
    {% endif %}

    <form action="/auth/login" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Nombre de Usuario</label>
            <input type="text" name="username" required autofocus
                placeholder="Ej: Spini o Pedrito"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-physics-500 focus:bg-white transition">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Contrasena</label>
            <input type="password" name="password" required
                placeholder="••••••••"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-physics-500 focus:bg-white transition">
        </div>

        <button type="submit"
            class="w-full py-2.5 px-4 bg-physics-600 hover:bg-physics-700 text-white font-bold rounded-lg shadow transition text-sm">
            Ingresar a la Plataforma
        </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center text-sm text-slate-600">
        ¿No tienes cuenta aun?
        <a href="/auth/register" class="font-bold text-physics-600 hover:underline">Registrate aqui</a>
    </div>
</div>
{% endblock %}
